# Publishes the site to GitHub Pages on every push to the default branch.
#
# Pages serves the `gh-pages` branch, which holds only what is served:
# index.html, assets/, _headers and a .nojekyll marker. The repository's own
# root keeps the README and tools/, which have no business on a public web
# server.
#
# Cloudflare Pages can be pointed at the same `gh-pages` branch, so both hosts
# serve an identical tree and neither needs a build step.
#
# Pushing that branch is also what switched Pages on in the first place — the
# workflow token is not allowed to create a Pages site through the API (GitHub
# treats that as an admin action), but it is allowed to push a branch, and
# Pages picks up `gh-pages` by itself.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/indian-book-records-dance-mvsmpa]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble what gets served
        run: |
          mkdir -p ../site
          cp -r ./*.html assets _headers ../site/
          touch ../site/.nojekyll

      - name: Push it to gh-pages
        run: |
          cd ../site
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
